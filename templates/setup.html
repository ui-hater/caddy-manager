{{define "content"}}
<section class="card narrow wide">
  <h1>{{t "Ersteinrichtung"}}</h1>
  <p class="muted">{{t "Lege das Administrator-Konto an und sag caddy-manager, wo deine Caddy-Konfiguration liegt. Diese Seite ist nur verfügbar, solange es noch kein Konto gibt."}}</p>
  <form method="post" action="/setup" class="stack">
    <h2>{{t "Administrator"}}</h2>
    <label>{{t "Benutzername"}} <input name="username" value="{{.D.Username}}" autocomplete="username" required pattern="[A-Za-z0-9_.\-]{3,32}"></label>
    <label>{{t "Passwort"}} <input type="password" name="password" autocomplete="new-password" minlength="10" required></label>
    <label>{{t "Passwort wiederholen"}} <input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>

    <h2>{{t "Caddy"}}</h2>
    {{template "caddy-settings" .D.Settings}}
    <button>{{t "Einrichtung abschließen"}}</button>
  </form>
</section>
{{end}}
